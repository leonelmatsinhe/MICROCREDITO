# /etc/nginx/sites-available/microcredito-demo.conf
# DEMO — demo.tuaempresa.co.mz → app microcredito-demo (localhost:4001)
# Activar:  sudo ln -s /etc/nginx/sites-available/microcredito-demo.conf /etc/nginx/sites-enabled/
# SSL:      sudo certbot --nginx -d demo.tuaempresa.co.mz
# BLOQUEAR INDEXAÇÃO (demo):
#   acrescentar dentro do server { }:
#       add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;

server {
    listen 80;
    listen [::]:80;
    server_name demo.tuaempresa.co.mz;

    add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}
