# /etc/nginx/sites-available/microcredito-a.conf
# PROD — a.tuaempresa.co.mz → app microcredito-a (localhost:4000)
# Activar:  sudo ln -s /etc/nginx/sites-available/microcredito-a.conf /etc/nginx/sites-enabled/
# SSL:      sudo certbot --nginx -d a.tuaempresa.co.mz   (certbot insere os blocos https)

server {
    listen 80;
    listen [::]:80;
    server_name a.tuaempresa.co.mz;

    # Uploads (fotos de garantias, logotipos, recibos PDF)
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}
