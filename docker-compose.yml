services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - TZ=Africa/Maputo
      - UPLOADS_DIR=/app/uploads
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT:-3306}
      - DATABASE_NAME=${DATABASE_NAME:-mbr_microcredito}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASS=${DATABASE_PASS}
      - APP_SECRET=${APP_SECRET}
      - TENANT_MODE=single
      - COMPANY_DEFAULT_ID=36
      - SINGLE_TENANT_COMPANY_ID=36
    volumes:
      # PERSISTÊNCIA CRÍTICA: protege contratos, documentos de mutuários, garantias e recibos
      - microcredito_uploads:/app/uploads

volumes:
  microcredito_uploads:
    name: microcredito_uploads
    driver: local
